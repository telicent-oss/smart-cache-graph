suite: ServiceAccount tests 

templates:
  - templates/serviceaccount.yaml

set:
  serviceAccount:
    create: true
    name: helm-unit-test
    automount: true

tests:
  - it: should create a ServiceAccount when enabled
    asserts:
      - isKind:
          of: ServiceAccount

  - it: should not create a ServiceAccount when disabled
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should set automountServiceAccountToken to true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: should set automountServiceAccountToken to false
    set:
      serviceAccount:
        automount: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false