openapi: 3.0.3
info:
  title: Security Labels Query API
  description: API for querying security labels.
  version: 0.82.8
servers:
  - url: http://localhost:3030/
    description: Base path for query operations.
components:
  schemas:
    QuadQuery:
      type: object
      properties:
        graph:
          type: string
          description: |
            Optional graph IRI to look in, or `*` for all graphs. Defaults to the default graph if omitted.
        subject:
          type: string
        predicate:
          type: string
        object:
          type: object
          properties:
            dataType:
              type: string
            value:
              type: string
            language:
              type: string
          required:
            - value
      required:
        - subject
        - predicate
        - object
  securitySchemes:
    BearerAuth:
      description: Generic Bearer Authentication is supported using JWTs
      type: http
      scheme: bearer
      bearerFormat: JWT
    AwsBearerAuth:
      description: |
        For AWS usage we support JWTs that are injected into requests by the ELB.  
        Since these come in a non-standard HTTP header we have to declare this as
        an API Key scheme in OpenAPI spec as it doesn't have a notion of using a
        HTTP scheme in a non-standard way (yay AWS weirdness!)
      type: apiKey
      in: header
      name: X-Amzn-Oidc-Data
security:
  - BearerAuth: []
  - AwsBearerAuth: []
paths:
  /$/labels/{datasetName}:
    post:
      summary: Find security labels for a given triple
      description: |
        Retrieves a list of the security labels for a given triple.

        The triples to look up may be supplied under either a `quads` or a `triples` key, but not both.

        Each triple may optionally specify the `graph` to look in. If omitted the default graph is used. A graph of `*`
        searches the default graph and all named graphs. Any of `graph`, `subject`, `predicate` or `object.value` may be
        `*`, in which case matching triples are found in the dataset and the labels for each are returned.
      parameters:
        - name: datasetName
          in: path
          required: true
          description: The name of the dataset to look in.
          schema:
            type: string
      requestBody:
        description: The subject, predicate and object of the triple to retrieve security labels for.
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                Exactly one of `quads` or `triples` must be provided. The two keys are interchangeable and accept the
                same entries; supplying both is rejected as a bad request.
              properties:
                quads:
                  type: array
                  items:
                    $ref: '#/components/schemas/QuadQuery'
                triples:
                  type: array
                  items:
                    $ref: '#/components/schemas/QuadQuery'
              oneOf:
                - required:
                    - quads
                - required:
                    - triples
            examples:
              London_Population:
                value:
                  triples:
                    - subject: http://dbpedia.org/resource/London
                      predicate: http://dbpedia.org/ontology/populationTotal
                      object:
                        value: 8799800
                        dataType: xsd:integer
              London_Country:
                value:
                  triples:
                    - subject: http://dbpedia.org/resource/London
                      predicate: http://dbpedia.org/ontology/country
                      object:
                        value: http://dbpedia.org/resource/United_Kingdom
              London_Name:
                value:
                  triples:
                    - subject: http://dbpedia.org/resource/London
                      predicate: http://dbpedia.org/ontology/name
                      object:
                        value: London
                        language: en
              London_Country_Named_Graph:
                value:
                  triples:
                    - graph: http://example.org/graph/cities
                      subject: http://dbpedia.org/resource/London
                      predicate: http://dbpedia.org/ontology/country
                      object:
                        value: http://dbpedia.org/resource/United_Kingdom
              London_Country_Named_Graph_Quads:
                value:
                  quads:
                    - graph: http://example.org/graph/cities
                      subject: http://dbpedia.org/resource/London
                      predicate: http://dbpedia.org/ontology/country
                      object:
                        value: http://dbpedia.org/resource/United_Kingdom
              London_All_Graphs:
                value:
                  triples:
                    - graph: "*"
                      subject: http://dbpedia.org/resource/London
                      predicate: "*"
                      object:
                        value: "*"
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        subject:
                          type: string
                        predicate:
                          type: string
                        object:
                          type: string
                        graph:
                          type: string
                          description: Graph the triple is in. Omitted for the default graph.
                        labels:
                          type: array
                          description: List of the labels.
                          items:
                            type: string
                            description: List of the labels.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
        '503':
          description: Dataset temporarily unavailable during a maintenance operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
