suite: ConfigMap tests

templates:
  - templates/configmap-env.yaml
  - templates/configmap-fuseki.yaml

tests:
  - it: creates each ConfigMap with its generated name when no existingConfigMap given
    asserts:
      - isKind:
          of: ConfigMap
      - template: templates/configmap-env.yaml
        equal:
          path: metadata.name
          value: tc-graph-env
      - template: templates/configmap-fuseki.yaml
        equal:
          path: metadata.name
          value: tc-graph-fuseki


  - it: skips each ConfigMap when its existingConfigMap value is given
    set:
      configMap:
        existingEnvConfigMap: existing-cm
        existingFusekiConfigMap: existing-cm

    asserts:
      - template: templates/configmap-env.yaml
        hasDocuments:
          count: 0
      - template: templates/configmap-fuseki.yaml
        hasDocuments:
          count: 0


  - it: sets JETTY_OUTPUT_BUFFER_SIZE to the pooled 64 KiB default
    template: templates/configmap-env.yaml
    asserts:
      - equal:
          path: data.JETTY_OUTPUT_BUFFER_SIZE
          value: "65536"

  - it: sets JETTY_OUTPUT_BUFFER_SIZE from java.jettyOutputBufferSize
    template: templates/configmap-env.yaml
    set:
      java:
        jettyOutputBufferSize: "32768"
    asserts:
      - equal:
          path: data.JETTY_OUTPUT_BUFFER_SIZE
          value: "32768"

  - it: omits JETTY_OUTPUT_BUFFER_SIZE when java.jettyOutputBufferSize is empty
    template: templates/configmap-env.yaml
    set:
      java:
        jettyOutputBufferSize: ""
    asserts:
      - notExists:
          path: data.JETTY_OUTPUT_BUFFER_SIZE
