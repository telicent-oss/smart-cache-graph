name: Promote Deletion Worker to Quay

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to promote (defaults to latest release)
        required: false
        type: string

jobs:
  get-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version }}"
          if [[ -z "$VERSION" ]]; then
            VERSION=$(gh release view --repo "${{ github.repository }}" --json tagName -q '.tagName')
            VERSION="${VERSION#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Promoting version: $VERSION"

  promote:
    name: Promote to Quay
    needs: get-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Promote image and chart
        uses: telicent-oss/shared-workflows/.github/actions/promote-to-quay@main
        with:
          image: scg-deletion-worker
          chart: deletion-worker
          version: ${{ needs.get-version.outputs.version }}
          quay-username: ${{ secrets.QUAY_USERNAME }}
          quay-token: ${{ secrets.QUAY_TOKEN }}
          role-to-assume: ${{ secrets.AWS_ROLE_DEPLOY }}
          # Code health report. The deletion worker has its own SonarQube
          # project, analysed by the sonar-deletion-worker profile in the parent
          # pom, so the report uploaded under this component's release prefix is
          # the deletion worker's own rather than the graph's. The project key
          # lives in that pom, not a sonar-project.properties, so it is supplied
          # directly and the file lookup (and the checkout it needs) is skipped.
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
          sonar-project-key: telicent-oss_smart-cache-graph-deletion-worker
          sonar-project-file: ""
          sonar-report-s3-uri: s3://${{ secrets.RELEASE_ARTEFACT_BUCKET_NAME }}/scg-deletion-worker/${{ needs.get-version.outputs.version }}/SAST/
          sonar-report-aws-region: eu-west-2
          sonar-report-aws-role: ${{ secrets.SONAR_ROLE_TO_ASSUME }}
