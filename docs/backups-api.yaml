openapi: 3.0.3
info:
  title: Dataset Backup API
  description: API for managing dataset backups, including creation, listing, restoration, and deletion.
  version: 0.82.8
servers:
  - url: http://localhost:3030/
    description: Base path for dataset backup operations.
components:
  schemas:
    AsyncJobSubmission:
      type: object
      properties:
        job-id:
          type: string
        operation:
          type: string
        status:
          type: string
        status-path:
          type: string
        message:
          type: string
    AsyncJobStatus:
      type: object
      properties:
        job-id:
          type: string
        operation:
          type: string
        status:
          type: string
        status-path:
          type: string
        message:
          type: string
        submitted-at:
          type: string
          format: date-time
        started-at:
          type: string
          format: date-time
        completed-at:
          type: string
          format: date-time
        http-status:
          type: integer
        result:
          type: object
    RestoreState:
      type: object
      description: >
        The record a restore leaves next to a dataset's own files. It is written before the first of the dataset's
        stores is touched and removed when the restore succeeds, so one that is still there afterwards means the
        restore did not finish.
      properties:
        dataset-name:
          type: string
        state:
          type: string
          enum: [IN_PROGRESS, INCOMPLETE, FAILED]
          description: >
            `IN_PROGRESS` while a restore is running; `INCOMPLETE` if it never finished, in which case the dataset is
            withheld from service because its data and its security labels may not match; `FAILED` if it ran to
            completion and reported a failure, which is recorded but does not withhold the dataset.
        serving:
          type: boolean
          description: Whether the dataset is being served; `false` while the restore state is `INCOMPLETE`.
        backup-id:
          type: string
        started-at:
          type: string
          format: date-time
        updated-at:
          type: string
          format: date-time
        completed-modules:
          type: array
          description: The restore modules, e.g. `tdb` and `labels`, that had been applied when this was last written.
          items:
            type: string
        unfinished-modules:
          type: array
          description: >-
            The restore modules that began changing the dataset's own store and never reported that they had finished,
            so that store is neither in its old state nor its new one. Omitted when there are none. A labels store
            listed here means the dataset's data may be described by labels that do not belong to it.
          items:
            type: string
        reason:
          type: string
  responses:
    RestoreResponse:
      description: Dataset restored successfully.
      content:
        application/json:
          schema:
            type: object
            properties:
              restore-id:
                type: string
              date:
                type: string
                format: date-time
              backup-success:
                type: string
              restore:
                type: object
    NotFoundError:
      description: Backup not found.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
  securitySchemes:
    BearerAuth:
      description: Generic Bearer Authentication is supported using JWTs
      type: http
      scheme: bearer
      bearerFormat: JWT
    AwsBearerAuth:
      description: |
        For AWS usage we support JWTs that are injected into requests by the ELB.  
        Since these come in a non-standard HTTP header we have to declare this as
        an API Key scheme in OpenAPI spec as it doesn't have a notion of using a
        HTTP scheme in a non-standard way (yay AWS weirdness!)
      type: apiKey
      in: header
      name: X-Amzn-Oidc-Data
security:
  - BearerAuth: []
  - AwsBearerAuth: []
paths:
  /$/backups/create/{datasetName}:
    post:
      summary: Create a backup for a dataset
      description: Initiates a backup operation for the specified dataset.
      parameters:
        - name: datasetName
          in: path
          required: true
          description: The name of the dataset to back up.
          schema:
            type: string
        - name: description
          in: query
          required: false
          description: A description of the back-up (i.e. "Daily backup")
          schema:
            type: string
        - name: async
          in: query
          required: false
          description: When `true`, submit the backup as an asynchronous job and poll `/$/backups/jobs/{jobId}` for completion.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Backup created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataset:
                    type: string
                    description: Name of the dataset backed up.
                  date:
                    type: string
                    format: date-time
                    description: Timestamp of the backup operation.
                  backup:
                    type: object
                    description: Details of the backup operation.
        '202':
          description: Backup job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobSubmission'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
  /$/backups/create/:
    post:
      summary: Create a backup for all available datasets
      description: Initiates a backup operation for all of datasets .
      parameters:
        - name: description
          in: query
          required: false
          description: A description of the back-up (i.e. "Daily backup")
          schema:
            type: string
        - name: async
          in: query
          required: false
          description: When `true`, submit the backup as an asynchronous job and poll `/$/backups/jobs/{jobId}` for completion.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Backup created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataset:
                    type: string
                    description: Name of the dataset backed up.
                  date:
                    type: string
                    format: date-time
                    description: Timestamp of the backup operation.
                  backup:
                    type: object
                    description: Details of the backup operation.
        '202':
          description: Backup job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobSubmission'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.

  /$/backups/list:
    get:
      summary: List all backups
      description: Retrieves a list of all backups stored on the server.
      responses:
        '200':
          description: List of backups retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    format: date-time
                    description: Timestamp of the listing operation.
                  backups:
                    type: object
                    description: |
                      Backup metadata keyed by backup ID as a string, e.g. `"1"`, `"2"`.
                      Each value is the JSON metadata recorded for that backup.
                    additionalProperties:
                      type: object
                      properties:
                        backup-id:
                          type: integer
                          description: Numeric ID of the backup.
                        backup-type:
                          type: string
                          description: Dataset name for a dataset-specific backup, or `FULL` for a full backup.
                        backup-name:
                          type: string
                          description: Optional human-readable backup name.
                        user:
                          type: string
                          description: User that created the backup.
                        description:
                          type: string
                          description: Optional backup description.
                        date:
                          type: string
                          format: date-time
                          description: Timestamp recorded for the backup.
                        start-time:
                          type: string
                          format: date-time
                          description: Start time of the backup operation.
                        datasets:
                          type: array
                          description: Per-dataset backup details captured for the backup.
                          items:
                            type: object
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.

  /$/backups/datasets/list:
    get:
      summary: Get a list of all available datasets
      description: Gets a list of all available datasets
      responses:
        '200':
          description: Dataset list retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    format: date-time
                    description: Timestamp of the listing operation.
                  datasets:
                    type: array
                    items:
                      type: string
                    description: Names of datasets available for backup operations.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.

  /$/backups/restore:
    post:
      summary: Restore the latest backup
      description: Restores the latest snapshot.
      parameters:
        - name: async
          in: query
          required: false
          description: When `true`, submit the restore as an asynchronous job and poll `/$/backups/jobs/{jobId}` for completion.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          $ref: '#/components/responses/RestoreResponse'
        '202':
          description: Restore job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobSubmission'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /$/backups/restore/{restoreId}:
    post:
      summary: Restore a specific backup
      description: Restores a dataset from a specified snapshot.
      parameters:
        - name: restoreId
          in: path
          required: true
          description: ID of the backup to restore.
          schema:
            type: string
        - name: async
          in: query
          required: false
          description: When `true`, submit the restore as an asynchronous job and poll `/$/backups/jobs/{jobId}` for completion.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          $ref: '#/components/responses/RestoreResponse'
        '202':
          description: Restore job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobSubmission'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /$/backups/jobs:
    get:
      summary: List asynchronous backup jobs
      description: Retrieves running and completed async backup/restore jobs known to this server instance.
      responses:
        '200':
          description: Backup jobs retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    format: date-time
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AsyncJobStatus'
                  restore-state:
                    type: array
                    description: >
                      Durable records of restores that did not complete. Job records only last as long as the process
                      that ran them, so a restore interrupted by the service stopping is reported here and not under
                      `jobs`.
                    items:
                      $ref: '#/components/schemas/RestoreState'
  /$/backups/jobs/{jobId}:
    get:
      summary: Get asynchronous backup job status
      description: Retrieves the current status of one async backup/restore job.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Backup job retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    format: date-time
                  job:
                    $ref: '#/components/schemas/AsyncJobStatus'
        '404':
          description: Backup job not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /$/backups/restore-state:
    get:
      summary: List restores that did not complete
      description: >
        Retrieves the durable record of any restore that did not complete. A dataset whose restore was interrupted may
        have had some of its stores replaced and not others, so its security labels may no longer describe its data;
        such a dataset is withheld from service and reported here with `state: INCOMPLETE`. Restoring the dataset
        successfully is the only supported way to return it to service, and clears the record.
      responses:
        '200':
          description: Restore state retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    format: date-time
                  restore-state:
                    type: array
                    items:
                      $ref: '#/components/schemas/RestoreState'

  /$/backups/restore-state/{datasetName}:
    get:
      summary: Get the restore state of one dataset
      parameters:
        - name: datasetName
          in: path
          required: true
          description: The dataset to report on.
          schema:
            type: string
      responses:
        '200':
          description: Restore state retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    format: date-time
                  dataset-name:
                    type: string
                  restore-state:
                    type: array
                    items:
                      $ref: '#/components/schemas/RestoreState'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /$/backups/restore/{datasetName}:
    post:
      summary: Restore the latest backup of specific dataset
      description: Restores the latest backup, but only for the given dataset.
      parameters:
        - name: datasetName
          in: path
          required: true
          description: The dataset to restore.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/RestoreResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /$/backups/restore/{restoreId}/{datasetName}:
    post:
      summary: Restore a specific backup of specific dataset
      description: Restores a dataset from a specified backup (ignoring the others in the backup).
      parameters:
        - name: restoreId
          in: path
          required: true
          description: ID of the backup to restore.
          schema:
            type: string
        - name: datasetName
          in: path
          required: true
          description: The name of the specific dataset to restore.
          schema:
            type: string
      responses:
          '200':
            $ref: '#/components/responses/RestoreResponse'
          '404':
            $ref: '#/components/responses/NotFoundError'
          '500':
            $ref: '#/components/responses/InternalServerError'

  /$/backups/delete/{deleteId}:
    post:
      summary: Delete a backup
      description: Deletes a specified backup.
      parameters:
        - name: deleteId
          in: path
          required: true
          description: ID of the backup to delete.
          schema:
            type: string
      responses:
        '200':
          description: Backup deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  delete-id:
                    type: string
                    description: ID of the deleted backup.
                  date:
                    type: string
                    format: date-time
                    description: Timestamp of the deletion operation.
                  delete:
                    type: object
                    description: Details of the deletion operation.
        '404':
          description: Backup not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
  /$/backups/validate/{backupId}:
    post:
      summary: Validate a backup using SHACL
      description: Validates a given backup using a SHACL shape provided in the request body
      parameters:
        - name: backupId
          in: path
          required: true
          description: ID of the backup to validate.
          schema:
            type: string
      responses:
        '200':
          description: Backup validation completed sucessfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup-id:
                    type: string
                    description: ID of the validated backup.
                  date:
                    type: string
                    format: date-time
                    description: Timestamp of the validation operation.
                  validate-path:
                    type: string
                    description: Backup path for validation.
                  results:
                    type: object
                    description: Dataset validation results.
        '404':
          description: Backup not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
  /$/backups/validate/{backupId}/{datasetName}:
    post:
      summary: Validate a dataset backup using SHACL
      description: Validates a given dataset within a given backup using a SHACL shape provided in the request body
      parameters:
        - name: backupId
          in: path
          required: true
          description: ID of the backup to validate.
          schema:
            type: string
        - name: datasetName
          in: path
          required: true
          description: Name of the dataset to validate.
          schema:
            type: string
      responses:
        '200':
          description: Backup validation completed sucessfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup-id:
                    type: string
                    description: ID of the validated backup.
                  date:
                    type: string
                    format: date-time
                    description: Timestamp of the validation operation.
                  validate-path:
                    type: string
                    description: Backup path for validation.
                  results:
                    type: object
                    description: Dataset validation results.
        '404':
          description: Backup not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
  /$/backups/report/{backupId}/{datasetName}:
    get:
      summary: View a dataset validation report
      description: Retrieves a backup validation report for a specific backup and dataset
      parameters:
        - name: backupId
          in: path
          required: true
          description: ID of the backup to validate.
          schema:
            type: string
        - name: datasetName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Validation report successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup-id:
                    type: string
                    description: ID of the backup
                  dataset-name:
                    type: string
                    description: Name of the dataset

                  result:
                    type: object
                    description: The validation report.
        '404':
          description: Backup report not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
  /$/backups/details/{backupId}:
    get:
      summary: View detailed information about a backup
      description: Retrieves the details of a given backup. Those include start and stop times, as well as duration, kafka offset, and size of the compressed backup.
      parameters:
        - name: backupId
          in: path
          required: true
          description: ID of the backup details.
          schema:
            type: string
      responses:
        '200':
          description: Backup details successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup-id:
                    type: string
                    description: ID of the backup
                    example: "2"
                  date:
                    type: string
                    description: Date of the backup in YYYY-MM-DD_HH-MM-SS format
                    example: "2025-07-29_13-55-22"
                  details:
                    type: object
                    description: Detailed metadata about the backup
                    properties:
                      backup-id:
                        type: string
                        example: "2"
                      details-path:
                        type: string
                        description: Filesystem path to the backup details
                        example: "/fuseki/backups/2"
                      zip-size-in-bytes:
                        type: integer
                        description: Size of the backup zip in bytes
                        example: 604
                      zip-size:
                        type: string
                        description: Human-readable size
                        example: "604 bytes"
                      start-time:
                        type: string
                        format: date-time
                        description: Backup start time
                        example: "2025-07-29T09:21:06.125229292Z"
                      end-time:
                        type: string
                        format: date-time
                        description: Backup end time
                        example: "2025-07-29T09:21:06.133364125Z"
                      backup-duration:
                        type: string
                        description: Backup duration as a human-readable string
                        example: "8ms"
                      backup-duration-in-ms:
                        type: integer
                        description: Backup duration in milliseconds
                        example: 8
                    required:
                      - backup-id
                      - details-path
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
