openapi: 3.0.3
info:
  title: Triple Access Query API
  description: API for querying access to RDF triples.
  version: 0.83.6
servers:
  - url: http://localhost:3030/
    description: Base path for query operations.
paths:
  /{datasetName}/access/query:
    post:
      summary: Return the objects for a given subject and predicate in an RDF triple
      description: Returns zero or more objects for a given subject and predicate in an RDF triple provided 1) they exist and 2) the user has access - otherwise null is returned.
      parameters:
        - name: datasetName
          in: path
          required: true
          description: The name of the dataset to query.
          schema:
            type: string
      requestBody:
        description: The subject and predicate to retrieve objects for.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                predicate:
                  type: string
            examples:
              London Population:
                value:
                  subject: http://dbpedia.org/resource/London
                  predicate: http://dbpedia.org/ontology/populationTotal
              London Country:
                value:
                  subject: http://dbpedia.org/resource/London
                  predicate: http://dbpedia.org/ontology/country
              London Birth Date:
                value:
                  subject: http://dbpedia.org/resource/London
                  predicate: http://dbpedia.org/ontology/birthDate
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject:
                    type: string
                  predicate:
                    type: string
                  objects:
                    type: array
                    items:
                      type: object
                      properties:
                        dataType:
                          type: string
                        value:
                          type: string
              examples:
                London Population:
                  value:
                    subject: http://dbpedia.org/resource/London
                    predicate: http://dbpedia.org/ontology/populationTotal
                    objects:
                      - dataType: http://www.w3.org/2001/XMLSchema#integer
                        value: "8799800"
                London Country:
                  value:
                    subject: http://dbpedia.org/resource/London
                    predicate: http://dbpedia.org/ontology/country
                    objects:
                      - value: http://dbpedia.org/resource/United_Kingdom
                      - value: http://dbpedia.org/resource/England
                London Birth Date:
                  value:
                    subject: http://dbpedia.org/resource/London
                    predicate: http://dbpedia.org/ontology/birthDate
                    objects: null
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
        '503':
          description: Dataset temporarily unavailable during a maintenance operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
  /{datasetName}/access/triples:
    post:
      summary: Return a boolean value to indicate whether the requested triple(s) are visible to the user.
      description: Returns the request triples together with a boolean indicating whether the request triples are visible to the user, depending on 1) whether they exist 2) whether the user has access to see them 3) whether the user has indicated they want to know if all are visible or any of them.
      parameters:
        - name: datasetName
          in: path
          required: true
          description: The name of the dataset to query.
          schema:
            type: string
        - name: all
          in: query
          required: false
          description: All triples need to be visible, not just some.
          schema:
            type: boolean
            default: true
      requestBody:
        description: An array or triples, each containing the subject, predicate and object to be checked.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                triples:
                  type: array
                  items:
                    type: object
                    properties:
                      subject:
                        type: string
                      predicate:
                        type: string
                      object:
                        type: object
                        properties:
                          dataType:
                            type: string
                            description: Can be a full URI or prefixed value (eg. xsd:string)
                          value:
                            type: string
                            description: If supplied without a dataType or language is assumed to be a URI
                          language:
                            type: string
                            description: An IETF BCP 47 language tag (e.g. 'en' or 'fr')
            examples:
              London:
                value:
                  triples:
                    - subject: http://dbpedia.org/resource/London
                      predicate: http://dbpedia.org/ontology/populationTotal
                      object:
                        dataType: xsd:integer
                        value: "8799800"
                    - subject: http://dbpedia.org/resource/London
                      predicate: http://dbpedia.org/ontology/country
                      object:
                        value:  http://dbpedia.org/resource/United_Kingdom
                    - subject: http://dbpedia.org/resource/London
                      predicate: http://xmlns.com/foaf/0.1/homepage
                      object:
                        dataType: xsd:anyURI
                        value: "https://www.london.gov.uk/"
                    - subject: http://dbpedia.org/resource/London
                      predicate: http://dbpedia.org/ontology/name
                      object:
                        value: "London"
                        language: "en"
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  triples:
                    type: array
                    items:
                      type: object
                      properties:
                        subject:
                          type: string
                        predicate:
                          type: string
                        object:
                          type: object
                          properties:
                            dataType:
                              type: string
                            value:
                              type: string
                            language:
                              type: string
                  visible:
                    type: boolean
              examples:
                London:
                  value:
                    triples:
                      - subject: http://dbpedia.org/resource/London
                        predicate: http://dbpedia.org/ontology/populationTotal
                        object:
                          dataType: xsd:integer
                          value: "8799800"
                      - subject: http://dbpedia.org/resource/London
                        predicate: http://dbpedia.org/ontology/country
                        object:
                          - value: http://dbpedia.org/resource/United_Kingdom
                      - subject: http://dbpedia.org/resource/London
                        predicate: http://xmlns.com/foaf/0.1/homepage
                        object:
                          dataType: xsd:anyURI
                          value: "https://www.london.gov.uk/"
                      - subject: http://dbpedia.org/resource/London
                        predicate: http://dbpedia.org/ontology/name
                        object:
                          value: "London"
                          language: "en"
                    visible: true
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
        '503':
          description: Dataset temporarily unavailable during a maintenance operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
  /{datasetName}/access/labels:
    post:
      summary: Find the security labels of the triples/quads visible to the user
      description: |
        Access controlled variant of `/$/labels/{datasetName}` (see `labels-api.yaml`), with the same request and
        response format. Only quads the user can see are returned, and a hidden quad gives the same response as a
        non-existent one. Unlabelled quads use the dataset's default label (`authz:tripleDefaultAttributes`). The labels
        graph is never returned.

        Unlike `/$/labels/{datasetName}`, `object.dataType` and `object.language` are honoured, as the object must match
        the stored term exactly. A literal requested without its `dataType`/`language` won't match a typed or language
        tagged literal, so it returns no results.
      parameters:
        - name: datasetName
          in: path
          required: true
          description: The name of the dataset to query.
          schema:
            type: string
      requestBody:
        description: The triples/quads to retrieve security labels for.
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one of `quads` or `triples` must be provided.
              properties:
                quads:
                  type: array
                  items:
                    $ref: '#/components/schemas/LabelsQuadQuery'
                triples:
                  type: array
                  items:
                    $ref: '#/components/schemas/LabelsQuadQuery'
              oneOf:
                - required:
                    - quads
                - required:
                    - triples
            examples:
              London_Country:
                value:
                  triples:
                    - subject: http://dbpedia.org/resource/London
                      predicate: http://dbpedia.org/ontology/country
                      object:
                        value: http://dbpedia.org/resource/United_Kingdom
              London_Population:
                value:
                  triples:
                    - subject: http://dbpedia.org/resource/London
                      predicate: http://dbpedia.org/ontology/populationTotal
                      object:
                        value: "8799800"
                        dataType: xsd:integer
              London_All_Graphs:
                value:
                  triples:
                    - graph: "*"
                      subject: http://dbpedia.org/resource/London
                      predicate: "*"
                      object:
                        value: "*"
      responses:
        '200':
          description: Request processed successfully. Only visible quads are returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        subject:
                          type: string
                        predicate:
                          type: string
                        object:
                          type: string
                        graph:
                          type: string
                          description: Graph the triple is in. Omitted for the default graph.
                        labels:
                          type: array
                          description: List of the labels.
                          items:
                            type: string
              examples:
                London_Country:
                  value:
                    results:
                      - subject: http://dbpedia.org/resource/London
                        predicate: http://dbpedia.org/ontology/country
                        object: http://dbpedia.org/resource/United_Kingdom
                        labels:
                          - everyone
                Not_Visible_Or_Not_Found:
                  value:
                    results: []
        '400':
          description: Bad Request, the request body is invalid or couldn't be read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
        '503':
          description: Dataset temporarily unavailable during a maintenance operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message.
components:
  schemas:
    LabelsQuadQuery:
      type: object
      properties:
        graph:
          type: string
          description: Graph IRI, or `*` for all graphs. Omit for the default graph.
        subject:
          type: string
          description: Subject IRI, or `*`.
        predicate:
          type: string
          description: Predicate IRI, or `*`.
        object:
          type: object
          properties:
            value:
              type: string
              description: |
                Object value, or `*` for any. Without `dataType` or `language`, a URI if it starts with `http://` or
                `https://`, otherwise a plain string literal.
            dataType:
              type: string
              description: Literal data type, prefixed (e.g. `xsd:integer`) or a full URI.
            language:
              type: string
              description: Language tag (e.g. `en`). Can't be combined with `dataType`.
          required:
            - value
      required:
        - subject
        - predicate
        - object
