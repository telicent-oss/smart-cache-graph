suite: ConfigMap tests

templates:
  - templates/configmap-env.yaml

tests:
  - it: should create a ConfigMap with the generated name when no existingConfigMap given
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: tc-deletion-worker-env

  - it: should not create a ConfigMap when existingConfigMap is given
    set:
      configMap:
        existingEnvConfigMap: existing-cm
    asserts:
      - hasDocuments:
          count: 0