name: Deletion Worker Build

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ !contains(github.ref_name, 'release/') }}

jobs:
  maven-build:
    uses: telicent-oss/shared-workflows/.github/workflows/maven.yml@main
    permissions:
      contents: write
      id-token: write
      issues: write
      packages: write
      pull-requests: write
    with:
      USES_DOCKERHUB_IMAGES: true
      PUBLISH_SNAPSHOTS: true
      MAIN_BRANCH: main
      # The Deletion Worker is a standalone application, not a library, so nothing from this
      # workflow goes to Maven Central.  Publishing of scg-base/scg-system is owned solely by
      # the SC Graph Build workflow; without these two settings this workflow races it and one
      # of the two Central deployments is rejected for duplicate coordinates.
      #   - stopping at "install" means the deploy phase, which the central-publishing plugin
      #     binds its publish goal to, is never reached
      #   - skipPublishing disables that plugin outright, in case a deploy goal is reintroduced
      MAVEN_DEPLOY_GOALS: install
      MAVEN_ARGS: -DskipPublishing=true
      MAVEN_DEBUG_ARGS: -Dlogback.configurationFile=logback-debug.xml
      RUN_WINDOWS_BUILD: false
      JAVA_VERSION: 21
      PUBLISH_JACOCO_REPORT: true
    secrets: inherit

  docker-build:
    name: Build and push to ECR (${{ matrix.image }})
    strategy:
      matrix:
        image: [scg-deletion-worker]
        chartName: [deletion-worker]
      fail-fast: false
    needs: maven-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Build and push image to ECR
        uses: telicent-oss/shared-workflows/.github/actions/push-container-image@main
        with:
          app-name: ${{ matrix.image }}
          app-name-prefix: ""
          dockerfile: scg-deletion-worker/Dockerfile
          version: ${{ needs.maven-build.outputs.version }}
          target: ${{ matrix.image }}
          java-version: 21
          uses-maven: true
          registry: aws
          fail-on-unfixed: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          download-sbom: "false"
          enable-buildkit-cache: "true"
          build-args: |
            PROJECT_VERSION=${{ needs.maven-build.outputs.version }}
      - name: Package and push Helm chart to ECR
        uses: telicent-oss/shared-workflows/.github/actions/push-helm-chart@main
        with:
          app-name: ${{ matrix.chartName }}
          app-name-prefix: ""
          chart: charts/${{ matrix.chartName }}
          registry: aws
          version: ${{ needs.maven-build.outputs.version }}
          appVersion: ${{ needs.maven-build.outputs.version }}
          replace-chart-versions: true